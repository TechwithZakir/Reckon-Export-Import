[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reckon_export_import"
authors = [{name = "Reckon Technologies Ltd."}]
description = "Import and export management for ERPNext"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

